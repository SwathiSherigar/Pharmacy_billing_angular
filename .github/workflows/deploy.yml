name: Angular GitHub Pages Deploy

on:
  push:
    branches:
      - dev  # This triggers on push to dev branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'  # Match your Node version

      - name: Install dependencies
        run: npm ci

      - name: Build Angular App
        run: |
          npm run build -- --output-path=dist --base-href="https://SwathiSherigar.github.io/Pharmacy_billing_angular/"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/browser
          publish_branch: gh-pages

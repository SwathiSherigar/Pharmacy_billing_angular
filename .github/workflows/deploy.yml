name: Angular GitHub Pages Deploy

on:
  push:
    branches:
      - dev  # triggers deployment on push to dev branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'  # match your local version

      - name: Install dependencies
        run: npm ci

      - name: Build Angular App (Browser)
        run: |
          # Build Angular app for browser only
          npx ng build --configuration production --output-path=dist/browser --base-href="https://SwathiSherigar.github.io/Pharmacy_billing_angular/"

      - name: Add 404.html for SPA routing
        run: cp dist/browser/index.html dist/browser/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/browser
          publish_branch: gh-pages

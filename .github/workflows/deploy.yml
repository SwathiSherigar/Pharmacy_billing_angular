name: Angular Auto Deploy to GitHub Pages

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build Angular Browser App
        run: |
          npx ng build pharma-talewind \
            --configuration production \
            --output-path=dist/pharma-talewind/browser \
            --base-href="https://SwathiSherigar.github.io/Pharmacy_billing_angular/"

      - name: Verify dist folder
        run: ls -R dist/pharma-talewind/browser

      - name: Create 404.html for SPA
        run: |
          if [ -f dist/pharma-talewind/browser/browser/index.html ]; then
            cp dist/pharma-talewind/browser/browser/index.html dist/pharma-talewind/browser/browser/404.html
            echo "✅ 404.html created successfully"
          else
            echo "❌ index.html not found! Check the build output."
            ls -R dist/pharma-talewind/browser
            exit 1
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/pharma-talewind/browser/browser
          publish_branch: gh-pages
          keep_files: true
